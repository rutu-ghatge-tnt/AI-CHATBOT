<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="-apple-system, 'Inter', sans-serif">
  <defs>
    <style>
      .card-bg { fill:#FBF4E8; stroke:#E5D9BD; stroke-width:0.5; }
      .inner { fill:#FFFFFF; stroke:#E5D9BD; stroke-width:0.5; }
      .navy { fill:#1A2B47; }
      .sub { fill:#4A5568; }
      .muted { fill:#7A6B4C; }
      .label-tag { fill:#7A6B4C; font-size:10px; font-weight:600; letter-spacing:0.12em; }
      .lime { stroke:#B7D34E; stroke-width:2; fill:none; }
    </style>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="88">
      <stop offset="0" stop-color="#2864B8"/>
      <stop offset="1" stop-color="#5C8BD1"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="800" height="580" rx="14" class="card-bg"/>
  <text x="36" y="42" class="label-tag">SCREEN 2 · TODAY · SFI + SCORE BREAKDOWN</text>

  <text x="36" y="78" font-size="18" font-weight="500" class="navy">Your skin outlook</text>
  <line x1="36" y1="86" x2="178" y2="86" class="lime"/>

  <!-- Ring + outlook text -->
  <g transform="translate(56,120)">
    <!-- progress ring (60%) -->
    <circle cx="44" cy="44" r="40" fill="none" stroke="#DCE5F1" stroke-width="8"/>
    <circle cx="44" cy="44" r="40" fill="none" stroke="url(#ring)" stroke-width="8"
            stroke-dasharray="150.8 251.3" transform="rotate(-90 44 44)" stroke-linecap="round"/>
    <text x="44" y="42" text-anchor="middle" font-size="22" font-weight="600" class="navy">60</text>
    <text x="44" y="58" text-anchor="middle" font-size="10" class="muted">/100</text>
  </g>

  <text x="166" y="142" font-size="14" class="sub">Priya, sebum will run hot today. A blot habit through the</text>
  <text x="166" y="162" font-size="14" class="sub">day and a gentle double cleanse tonight really helps. A</text>
  <text x="166" y="182" font-size="14" class="sub">brightening serum on yesterday's marks is what helps most.</text>

  <!-- Score breakdown heading -->
  <text x="36" y="252" font-size="13" class="label-tag">SCORE BREAKDOWN</text>
  <line x1="36" y1="262" x2="170" y2="262" class="lime"/>

  <!-- 4 band cards in 2x2 grid -->
  <!-- Band 1: Sun strength -->
  <g transform="translate(36,278)">
    <rect width="365" height="120" rx="10" class="inner"/>
    <text x="16" y="24" font-size="12" font-weight="600" class="navy">☀  Sun strength</text>
    <text x="16" y="44" font-size="13" font-weight="500" fill="#E58124">Strong</text>
    <text x="16" y="66" font-size="12" class="sub">Post-acne marks darken faster</text>
    <text x="16" y="82" font-size="12" class="sub">without sunscreen.</text>
    <rect x="16" y="96" width="333" height="6" rx="3" fill="#F4E3C8"/>
    <rect x="16" y="96" width="233" height="6" rx="3" fill="#E58124"/>
  </g>

  <!-- Band 2: Heat -->
  <g transform="translate(419,278)">
    <rect width="365" height="120" rx="10" class="inner"/>
    <text x="16" y="24" font-size="12" font-weight="600" class="navy">🔥  Heat</text>
    <text x="16" y="44" font-size="13" font-weight="500" fill="#E58124">Hot afternoon</text>
    <text x="16" y="66" font-size="12" class="sub">Sebum runs warmer; jaw and</text>
    <text x="16" y="82" font-size="12" class="sub">chin shine by mid-day.</text>
    <rect x="16" y="96" width="333" height="6" rx="3" fill="#F4E3C8"/>
    <rect x="16" y="96" width="216" height="6" rx="3" fill="#E58124"/>
  </g>

  <!-- Band 3: Air quality -->
  <g transform="translate(36,412)">
    <rect width="365" height="120" rx="10" class="inner"/>
    <text x="16" y="24" font-size="12" font-weight="600" class="navy">🌫  Air quality</text>
    <text x="16" y="44" font-size="13" font-weight="500" fill="#5240A6">Mostly clean</text>
    <text x="16" y="66" font-size="12" class="sub">Light particulate — background</text>
    <text x="16" y="82" font-size="12" class="sub">pressure.</text>
    <rect x="16" y="96" width="333" height="6" rx="3" fill="#E2DCF3"/>
    <rect x="16" y="96" width="83" height="6" rx="3" fill="#5240A6"/>
  </g>

  <!-- Band 4: Air moisture -->
  <g transform="translate(419,412)">
    <rect width="365" height="120" rx="10" class="inner"/>
    <text x="16" y="24" font-size="12" font-weight="600" class="navy">💧  Air moisture</text>
    <text x="16" y="44" font-size="13" font-weight="500" fill="#A2342F">Muggy, rising</text>
    <text x="16" y="66" font-size="12" class="sub">Fungal-acne risk on chest and</text>
    <text x="16" y="82" font-size="12" class="sub">back climbs this week.</text>
    <rect x="16" y="96" width="333" height="6" rx="3" fill="#FCEDED"/>
    <rect x="16" y="96" width="183" height="6" rx="3" fill="#A2342F"/>
  </g>

  <text x="36" y="568" font-size="11" class="muted" font-style="italic">Tap a band to see contributing rules · acne lens</text>
</svg>
