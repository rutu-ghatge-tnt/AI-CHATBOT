<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" font-family="-apple-system, 'Inter', sans-serif">
  <defs>
    <style>
      .card-bg { fill:#FBF4E8; stroke:#E5D9BD; stroke-width:0.5; }
      .navy { fill:#1A2B47; }
      .sub { fill:#4A5568; }
      .muted { fill:#7A6B4C; }
      .label-tag { fill:#7A6B4C; font-size:10px; font-weight:600; letter-spacing:0.12em; }
      .lime { stroke:#B7D34E; stroke-width:2; fill:none; }
      .tier-label { font-size:10px; font-weight:700; letter-spacing:0.12em; }
      .src { font-size:11px; fill:#7A6B4C; font-style:italic; }
    </style>
  </defs>

  <rect x="10" y="10" width="800" height="960" rx="14" class="card-bg"/>
  <text x="36" y="42" class="label-tag">SCREEN 3 · TODAY · 3 ALERTS + SYMPTOM CHIPS</text>

  <text x="36" y="78" font-size="18" font-weight="500" class="navy">Three alerts for today</text>
  <line x1="36" y1="86" x2="222" y2="86" class="lime"/>

  <!-- ALERT 1 - mint tint -->
  <g transform="translate(36,108)">
    <rect width="748" height="218" rx="12" fill="#E9F4EC" stroke="#C7E0CE" stroke-width="0.5"/>
    <circle cx="22" cy="22" r="10" fill="#3F6A1D"/>
    <text x="22" y="26" text-anchor="middle" font-size="11" fill="white" font-weight="700">1</text>
    <text x="42" y="26" font-size="14" font-weight="600" class="navy">Sebum-rush day — face will shine through afternoon</text>
    <text x="22" y="58" font-size="13" class="sub">Heat plus muggy air pushes sebum hard today. A gentle gel cleanse this morning, a blot habit</text>
    <text x="22" y="76" font-size="13" class="sub">through the day, and a niacinamide-class brightening serum on the marks you already have.</text>

    <text x="22" y="106" class="tier-label" fill="#2864B8">HOW</text>
    <text x="22" y="124" font-size="12" class="sub">Gel cleanser → niacinamide-class brightening serum → oil-free moisturizer → non-comedogenic SPF.</text>

    <text x="22" y="154" class="tier-label" fill="#5240A6">DID YOU KNOW</text>
    <text x="22" y="172" font-size="12" class="sub">Skin temperature rising by even a couple of degrees pushes sebaceous output measurably higher.</text>

    <line x1="22" y1="188" x2="730" y2="188" stroke="#C7E0CE" stroke-dasharray="2,3"/>
    <text x="22" y="206" class="src">Source · Skin Diseases in Females (Sarkar) Ch. 4 · Sardana CBS Ch. 8</text>
  </g>

  <!-- ALERT 2 - blue tint -->
  <g transform="translate(36,346)">
    <rect width="748" height="218" rx="12" fill="#ECF2FA" stroke="#C9D9EE" stroke-width="0.5"/>
    <circle cx="22" cy="22" r="10" fill="#2864B8"/>
    <text x="22" y="26" text-anchor="middle" font-size="11" fill="white" font-weight="700">2</text>
    <text x="42" y="26" font-size="14" font-weight="600" class="navy">Monsoon's turning on — heads up for chest and back</text>
    <text x="22" y="58" font-size="13" class="sub">Humidity is climbing fast. Yeast-driven fungal acne on chest and back is the predictable</text>
    <text x="22" y="76" font-size="13" class="sub">monsoon pattern. Switch the heavy hair oil to a lighter rinse this week.</text>

    <text x="22" y="106" class="tier-label" fill="#2864B8">HOW</text>
    <text x="22" y="124" font-size="12" class="sub">Antifungal-friendly body wash 2-3 nights/week · loose cotton tops · scalp rinse after sweating.</text>

    <text x="22" y="154" class="tier-label" fill="#5240A6">DID YOU KNOW</text>
    <text x="22" y="172" font-size="12" class="sub">Malassezia thrives at 25–28°C with high humidity — the exact monsoon window in coastal India.</text>

    <line x1="22" y1="188" x2="730" y2="188" stroke="#C9D9EE" stroke-dasharray="2,3"/>
    <text x="22" y="206" class="src">Source · Sardana CBS p. 343 · Humidity sheet rows 187, 211 · PMID 31333890</text>
  </g>

  <!-- ALERT 3 - violet tint -->
  <g transform="translate(36,584)">
    <rect width="748" height="218" rx="12" fill="#EFEAF7" stroke="#D6CAEB" stroke-width="0.5"/>
    <circle cx="22" cy="22" r="10" fill="#5240A6"/>
    <text x="22" y="26" text-anchor="middle" font-size="11" fill="white" font-weight="700">3</text>
    <text x="42" y="26" font-size="14" font-weight="600" class="navy">Cortisol's on the menu — short sleep + festival food</text>
    <text x="22" y="58" font-size="13" class="sub">Less than six hours of sleep and a high-glycemic spread tip cortisol and insulin, which</text>
    <text x="22" y="76" font-size="13" class="sub">show up in oilier skin the next day. Protein-led breakfast helps the rebound.</text>

    <text x="22" y="106" class="tier-label" fill="#2864B8">HOW</text>
    <text x="22" y="124" font-size="12" class="sub">Protein-first breakfast · cap added sugar today · same-time sleep window tonight.</text>

    <text x="22" y="154" class="tier-label" fill="#5240A6">DID YOU KNOW</text>
    <text x="22" y="172" font-size="12" class="sub">High-glycemic loads in Indian study cohorts correlate with acne severity scores within 48 hours.</text>

    <line x1="22" y1="188" x2="730" y2="188" stroke="#D6CAEB" stroke-dasharray="2,3"/>
    <text x="22" y="206" class="src">Source · Lifestyle sheet rows 144, 191 · PMID 29156452</text>
  </g>

  <!-- Chip strip header -->
  <text x="36" y="842" font-size="13" class="label-tag">TAP WHAT YOUR SKIN FEELS</text>
  <line x1="36" y1="852" x2="248" y2="852" class="lime"/>

  <!-- 10 chips, acne-relevant in peach -->
  <g transform="translate(36,866)">
    <g>
      <rect width="64" height="28" rx="14" fill="#FBE0CF" stroke="#F0BFA0" stroke-width="0.5"/>
      <text x="32" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#9C3E0A">oily</text>
    </g>
    <g transform="translate(72,0)">
      <rect width="68" height="28" rx="14" fill="#FBE0CF" stroke="#F0BFA0" stroke-width="0.5"/>
      <text x="34" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#9C3E0A">shiny</text>
    </g>
    <g transform="translate(148,0)">
      <rect width="88" height="28" rx="14" fill="#FBE0CF" stroke="#F0BFA0" stroke-width="0.5"/>
      <text x="44" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#9C3E0A">breakout</text>
    </g>
    <g transform="translate(244,0)">
      <rect width="92" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="46" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">congested</text>
    </g>
    <g transform="translate(344,0)">
      <rect width="92" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="46" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">dark spots</text>
    </g>
    <g transform="translate(444,0)">
      <rect width="68" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="34" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">tight</text>
    </g>
    <g transform="translate(520,0)">
      <rect width="60" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="30" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">dry</text>
    </g>
    <g transform="translate(588,0)">
      <rect width="80" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="40" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">flaky</text>
    </g>
    <g transform="translate(676,0)">
      <rect width="70" height="28" rx="14" fill="#FFFFFF" stroke="#E5D9BD" stroke-width="0.5"/>
      <text x="35" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#1A2B47">itchy</text>
    </g>
  </g>

  <text x="36" y="938" font-size="11" class="muted" font-style="italic">+11 more · all 20 in Explore lane · Last updated 19 Jun 2026, 15:50</text>
</svg>
